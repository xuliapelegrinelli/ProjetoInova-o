<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FlexLog – Onde a capacidade encontra a oportunidade</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,600;0,700;0,800;1,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
<style>
:root{--navy:#0B2D5B;--or:#F97316;--sky:#0EA5E9;--gr:#E5E7EB;--bg:#F4F6FA;--tx:#475569}
*{box-sizing:border-box}
html,body{margin:0;padding:0;overflow-x:hidden;font-family:Montserrat,Arial,sans-serif;background:var(--bg);color:var(--tx)}
h1,h2,h3{color:var(--navy);margin:0 0 10px}h1{font-size:34px}h2{font-size:19px}p{line-height:1.5;font-size:14px;margin:0 0 12px}
a{color:inherit;text-decoration:none}

/* Header & Navegação */
header{position:sticky;top:0;z-index:500;background:#fff;border-bottom:1px solid #d1d5db;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 32px;min-height:66px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:8px;font-size:24px;font-weight:800;font-style:italic;color:var(--navy);letter-spacing:-1px}.logo em{color:var(--or)}
nav{display:flex;gap:22px;flex:1;justify-content:center}
nav a{font-size:14px;padding:21px 0;border-bottom:3px solid transparent;white-space:nowrap}
nav a:hover{color:var(--or)}nav a.on{color:var(--navy);font-weight:700;border-color:var(--or)}
.user-box{display:flex;align-items:center;gap:8px}
.user-pill{background:#E0F2FE;color:var(--navy);font-size:12px;font-weight:700;padding:6px 12px;border-radius:20px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.demo{background:#FFEDD5;color:#9A3412;text-align:center;font-size:12px;padding:6px 12px;line-height:1.4}

/* Layout Principal */
main{max-width:1180px;margin:0 auto;padding:28px 24px 60px}.view{display:none}.view.on{display:block;animation:in .3s ease}@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
.card{background:#fff;border:1px solid #d1d5db;border-radius:10px;padding:20px;transition:box-shadow .2s}.card:hover{box-shadow:0 8px 22px rgba(11,45,91,.12)}
.row{display:flex;gap:16px;flex-wrap:wrap}.row>*{flex:1;min-width:220px}.g{display:grid;gap:16px}.k4{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}

/* Formulários e Botões */
label{display:block;font-size:13px;font-weight:600;color:var(--navy);margin-bottom:6px}
input,select,textarea{width:100%;height:46px;border:1px solid #9ca3af;border-radius:8px;padding:0 12px;font:inherit;font-size:14px;margin-bottom:14px;background:#fff}
textarea{height:84px;padding:10px 12px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--sky);border-color:var(--sky)}input[type=checkbox]{width:18px;height:18px;margin:0;accent-color:var(--or);flex:none}
.ck{display:flex;gap:10px;align-items:center;font-size:14px;margin-bottom:12px}.ck label{margin:0;font-weight:400;color:var(--tx);cursor:pointer}
button{font:inherit;font-size:14px;font-weight:600;height:46px;padding:0 22px;border-radius:8px;cursor:pointer;transition:all .2s}
.btn{border:0;background:var(--or);color:#fff}.btn:hover{background:#EA580C;transform:translateY(-1px);box-shadow:0 6px 14px rgba(249,115,22,.35)}
.bt2{border:1px solid var(--navy);background:#fff;color:var(--navy)}.bt2:hover{background:var(--navy);color:#fff}.w{width:100%}
.btsm{height:36px;padding:0 12px;font-size:12px;border-radius:6px}
.chip{display:inline-block;padding:8px 14px;border-radius:20px;border:1px solid #cbd5e1;background:#fff;font-size:13px;font-weight:600;color:var(--navy);cursor:pointer;height:auto;margin:0 6px 8px 0}.chip.on,.chip:hover{background:var(--navy);color:#fff;border-color:var(--navy)}
.tag{display:inline-block;padding:4px 10px;border-radius:12px;background:#E0F2FE;color:#075985;font-size:12px;margin:0 6px 6px 0}.tag.o{background:#FFEDD5;color:#9A3412}.tag.warn{background:#FEE2E2;color:#991B1B}
.pl{display:inline-block;padding:4px 10px;border-radius:12px;font-size:12px;font-weight:600;white-space:nowrap}.pl.a{background:#FFEDD5;color:#9A3412}.pl.b{background:#E0F2FE;color:#075985}.pl.c{background:#DCFCE7;color:#166534}

/* Stepper & Hero */
.stp{display:flex;gap:8px;align-items:center;font-size:13px;margin-bottom:18px;color:#64748b;flex-wrap:wrap}.stp b{width:26px;height:26px;border-radius:50%;background:var(--gr);display:inline-flex;align-items:center;justify-content:center;font-size:12px;margin-right:6px}.stp .d{color:var(--navy);font-weight:700}.stp .d b{background:var(--or);color:#fff}.stp s{width:28px;height:2px;background:#cbd5e1}
.hero{display:flex;gap:32px;flex-wrap:wrap;align-items:flex-start}.hero>div:first-child{flex:1;min-width:280px;padding-top:8px}.hero h1{font-size:42px;line-height:1.15}.hero h1 span{color:var(--or)}
.search-card{width:420px;max-width:100%}
.bg{display:inline-block;padding:7px 12px;border-radius:8px;background:#E0F2FE;color:var(--navy);font-size:12px;font-weight:600;margin:0 8px 8px 0}

/* Cards de Operadores, Tabelas e Gráficos */
.op{display:flex;gap:16px;align-items:center;margin-bottom:12px;flex-wrap:wrap}.op svg{flex:none;border-radius:6px;background:#E5E7EB}.op .i{flex:1;min-width:200px}.op .pr{text-align:right}
.op-btns{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.tot
